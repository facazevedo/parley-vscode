name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Exposed as env so steps can gate on its presence (secrets can't be used in `if:` directly).
    env:
      PARLEY_SMOKE_KEY: ${{ secrets.PARLEY_SMOKE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run compile
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run package
      # Live smoke test against the real gateway — runs only when the repo secret is configured.
      - run: npm run test:smoke
        if: ${{ env.PARLEY_SMOKE_KEY != '' }}
        env:
          PARLEY_SMOKE_ENDPOINT: ${{ vars.PARLEY_SMOKE_ENDPOINT }}
          PARLEY_SMOKE_MODEL: ${{ vars.PARLEY_SMOKE_MODEL }}
      - uses: actions/upload-artifact@v4
        with:
          name: parley-vsix
          path: '*.vsix'
          if-no-files-found: error

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Launches a real VS Code instance (needs a virtual display on Linux).
      - run: xvfb-run -a npm run test:integration
